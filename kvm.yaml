substitutions:
  device_name: kvm
  friendly_name: KVM

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}

esp32:
  board: adafruit_qtpy_esp32s2
  framework:
    # Required: this component uses esp_tinyusb directly. Current ESPHome
    # defaults ESP32 to esp-idf anyway, but releases before ~2025.8 defaulted to
    # Arduino, so state it explicitly to stay portable across versions.
    type: esp-idf

external_components:
  - source:
      type: local
      path: components

logger:
  # USB_CDC is the *default* on the ESP32-S2 and shares the USB OTG peripheral
  # with our HID device, so it has to be moved off. The QT Py breaks out no
  # UART0 pins (GPIO43/44 are not on the castellations) and the S2 has no
  # USB-Serial-JTAG, so baud_rate: 0 turns serial logging off entirely.
  # Every log line comes over WiFi via the API instead.
  hardware_uart: UART0
  baud_rate: 0

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "${friendly_name} Fallback"

captive_portal:

usb_hid_keyboard:
  id: kbd
  usb_manufacturer_str: "ESPHome"
  usb_product_str: "KVM Control"
  # Raise both if the KVM misses keys in a hotkey sequence.
  key_hold: 20ms
  key_gap: 30ms

# Every entity below is write-only. Nothing reads back which port the KVM is
# actually on, so states are what we last commanded, not ground truth.

button:
  - platform: template
    name: "Next Port"
    icon: mdi:arrow-right-bold-box
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, RIGHT]

  - platform: template
    name: "Previous Port"
    icon: mdi:arrow-left-bold-box
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, LEFT]

  # One per PC. Adjust the count to the real number of ports.
  - platform: template
    name: "PC 1"
    icon: mdi:monitor
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, 1]

  - platform: template
    name: "PC 2"
    icon: mdi:monitor
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, 2]

  - platform: template
    name: "PC 3"
    icon: mdi:monitor
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, 3]

  - platform: template
    name: "PC 4"
    icon: mdi:monitor
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, 4]

  - platform: template
    name: "Toggle Auto-Cycle"
    icon: mdi:autorenew
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, S]

  - platform: template
    name: "Reset Hotkey Settings"
    icon: mdi:backup-restore
    entity_category: config
    # Wipes the KVM's hotkey configuration back to defaults.
    on_press:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, F, L, A, S, H, ENTER]

switch:
  - platform: template
    name: "Buzzer"
    icon: mdi:volume-high
    entity_category: config
    optimistic: true
    turn_on_action:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, B, 1]
    turn_off_action:
      - usb_hid_keyboard.send_keys:
          id: kbd
          keys: [SCROLL_LOCK, SCROLL_LOCK, B, 0]

number:
  - platform: template
    name: "Auto-Cycle Interval"
    icon: mdi:timer-cog
    entity_category: config
    unit_of_measurement: s
    min_value: 5
    max_value: 999
    step: 1
    initial_value: 15
    optimistic: true
    update_interval: never
    set_action:
      - usb_hid_keyboard.send_keys:
          id: kbd
          # ScrLk, ScrLk, I, <digits>, Enter -- the digit count varies, so this
          # one sequence has to be built at runtime.
          keys: !lambda |-
            std::vector<uint8_t> keys = {0x47, 0x47, 0x0C};  // ScrLk, ScrLk, I
            auto digits = usb_hid_keyboard::keys_from_string(to_string((int) x));
            keys.insert(keys.end(), digits.begin(), digits.end());
            keys.push_back(0x28);  // Enter
            return keys;
